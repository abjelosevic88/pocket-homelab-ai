name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Verify the reviewed Pocket Core SDK snapshot
        run: cd third_party/pocket-core && sha256sum -c SHA256SUMS
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-ai ./cmd/pocket-ai
      - name: Mobile assistant regression suite
        env:
          ADMIN_EMAIL: browser-test@example.test
          ADMIN_PASSWORD: browser-test-password
          ADMIN_NAME: Browser Test
          AI_TEST_BASE: http://127.0.0.1:8196
        run: |
          cd web && npx playwright install --with-deps chromium && cd ..
          DATA_DIR=/tmp/pocket-ai-browser AUTH_MODE=local HOST=127.0.0.1 PORT=8196 \
            BASE_URL=http://127.0.0.1:8196 CORE_URL= SECURE_COOKIES=false \
            CLAUDE_BIN=/nonexistent/claude CODEX_BIN=/nonexistent/codex ./pocket-ai > /tmp/pocket-ai-browser.log 2>&1 &
          browser_server_pid=$!
          trap 'kill "$browser_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8196/healthz >/dev/null; then break; fi
            sleep 1
          done
          cd web && npm run test:mobile
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pt AUTH_MODE=none HOST=127.0.0.1 PORT=8195 ./pocket-ai &
          sleep 2
          curl -fsS http://127.0.0.1:8195/healthz
          curl -fsS http://127.0.0.1:8195/api/v1/threads | grep -q '^\['
          curl -fsS http://127.0.0.1:8195/api/v1/recipes | grep -q 'Server health check'
          curl -fsS http://127.0.0.1:8195/api/v1/providers | grep -q '"id":"claude"'
          curl -fsS http://127.0.0.1:8195/ | grep -q '<div id="root">'
